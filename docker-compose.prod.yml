version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixeat-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - pixeat-network
    depends_on:
      - postgres
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  nginx:
    image: nginx:alpine
    container_name: pixeat-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl  # Para certificados SSL
    networks:
      - pixeat-network
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    container_name: pixeat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixeat_prod
      POSTGRES_USER: pixeat_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - pixeat-network
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: pixeat-redis
    restart: unless-stopped
    networks:
      - pixeat-network
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  pixeat-network:
    driver: bridge
