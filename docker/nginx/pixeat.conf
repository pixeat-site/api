server {
    listen 80;
    server_name localhost pixeat.site www.pixeat.site api.pixeat.site _;
    root /var/www/html;
    index index.html index.php;

    # Logs
    access_log /var/log/nginx/pixeat_access.log;
    error_log /var/log/nginx/pixeat_error.log;

    # API routes - passa tudo para Laravel
    location ~ ^/api {
        alias /var/www/html/src/public;
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        rewrite ^/api/(.*)$ /index.php?/$1 last;
        fastcgi_pass pixeat-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/src/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
    }

    # Servir arquivos estáticos (landing page)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP files do Laravel
    location ~ \.php$ {
        root /var/www/html/src/public;
        fastcgi_pass pixeat-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
