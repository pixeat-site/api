server {
    listen 80;
    server_name localhost pixeat.site www.pixeat.site api.pixeat.site _;
    root /var/www/html/public;
    index index.html index.php;

    # Logs
    access_log /var/log/nginx/pixeat_access.log;
    error_log /var/log/nginx/pixeat_error.log;

    # API routes - passa para Laravel
    location ~ ^/api {
        try_files $uri $uri/ /index.php?$query_string;
        
        location ~ \.php$ {
            fastcgi_pass pixeat-api:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            include fastcgi_params;
        }
    }

    # Servir arquivos estáticos (landing page e downloads)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP files do Laravel
    location ~ \.php$ {
        fastcgi_pass pixeat-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|apk)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
