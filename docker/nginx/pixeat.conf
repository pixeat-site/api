server {
    listen 80;
    server_name localhost pixeat.site www.pixeat.site api.pixeat.site _;
    root /var/www/html;
    index index.html index.php;

    # Logs
    access_log /var/log/nginx/pixeat_access.log;
    error_log /var/log/nginx/pixeat_error.log;

    # Servir arquivos estáticos (landing page)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API routes - passa para Laravel via FastCGI
    location /api/ {
        root /var/www/html/src/public;
        try_files $uri $uri/ /index.php?$query_string;
        
        # Passar para PHP-FPM
        location ~ \.php$ {
            fastcgi_pass pixeat-api:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
    
    # Rewrite para Laravel (todas as rotas API passam pelo index.php)
    location ~ ^/api {
        root /var/www/html/src/public;
        try_files $uri $uri/ /index.php?$query_string;
        
        fastcgi_pass pixeat-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/src/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    # PHP files
    location ~ \.php$ {
        root /var/www/html/src/public;
        fastcgi_pass pixeat-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
