server {
    listen 80;
    server_name localhost pixeat.site www.pixeat.site api.pixeat.site _;
    root /var/www/html/public;
    index index.html index.php;

    # Logs
    access_log /var/log/nginx/pixeat_access.log;
    error_log /var/log/nginx/pixeat_error.log;

    # API routes - passa TUDO para Laravel (sem try_files)
    location /api {
        # Não usar try_files aqui! Sempre passar para o PHP
        fastcgi_pass pixeat-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        include fastcgi_params;
    }

    # Servir arquivos estáticos (landing page e downloads)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP files do Laravel
    location ~ \.php$ {
        fastcgi_pass pixeat-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|apk)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
