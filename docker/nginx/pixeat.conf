server {
    listen 80;
    server_name localhost pixeat.site www.pixeat.site api.pixeat.site _;
    root /var/www/html;
    index index.html index.php;

    # Logs
    access_log /var/log/nginx/pixeat_access.log;
    error_log /var/log/nginx/pixeat_error.log;

    # Servir arquivos estáticos (landing page)
    location / {
        try_files $uri $uri/ @api;
    }

    # API routes - proxy para Laravel
    location /api/ {
        try_files $uri @api;
    }

    # Fallback para API Laravel
    location @api {
        proxy_pass http://pixeat-api:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Para PHP-FPM
        fastcgi_pass pixeat-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/src/public/index.php;
        include fastcgi_params;
    }

    # PHP files
    location ~ \.php$ {
        root /var/www/html/src/public;
        fastcgi_pass pixeat-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
